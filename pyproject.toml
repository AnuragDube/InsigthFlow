[project]
name = "insightflow"
version = "0.1.0"
description = "Data & AI intelligence platform (MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bm25s>=0.3.16",
    "duckdb>=2.0.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/insightflow"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "backend/tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Starlette's TestClient still works with httpx; it suggests a newer client we have not vetted.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608"]  # asserts in tests; SQL built only from trusted, validated identifiers (reviewed)

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B"]
"scripts/**" = ["S310"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
packages = ["insightflow"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff.lint.isort]
known-first-party = ["insightflow", "pipeline_helpers"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true  # dev-only tool for sample conversion
